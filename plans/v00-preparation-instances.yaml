  source_anchors:
  - src.huawei.hccl-user-guide-cann-8.1-rc1-alpha001
  - src.ascend.cann-hccl-2d685b08
  known_fields:
    question_and_hypotheses: 预注册 H1 rank/次序分叉、H2 上游阶段阻塞、H3 设备/runtime 先失败、H4 网络/链路先失败、H5 等待预算不足；须分离首因与级联。
    layered_design: A 无注入共同进度基线（须通过结果检查，仅性能无正确性不得作基线）→ B 工作负载阶段对照 → C group/次序对照（注入仅限审核后测试程序，正文不提供生产注入命令）→ D 设备/网络独立对照（仅被动证据指向特定实体时另立专项）。
    observation_fields: NPU/节点、软件、rank 映射、工作负载、时间/时钟、观测与日志容量、配置七类必填字段（方案"环境与输入"表）。
    preregistered_criteria: 支持 H1–H5、实验失败与无法判断的预注册判据表；单次"没有复现/退出为 0/check success"不证明任何根因。
    hccl_test_identity_boundary: src.ascend.cann-hccl-2d685b08 仅固定源码快照证据身份，README 自提示 master 与 CANN 版本可能不配套；执行须另取得与目标 CANN/HCCL 配套的 HCCL Test 发行物与说明——与 03.5-BLOCKED-1（HCCL Test × 目标 CANN/HDK/机型交集缺厂商一手资料）同源缺口。
    stop_and_recovery_requirements: 独占节点/NPU 与专用端口/日志/rank group；资源预算预先批准；每轮单变量并保存原值与回滚；注入限一次性无业务作业且 launcher 可全回收；停止判据（不可恢复错误、持续链路异常、隔离破坏、预算超限）先保存 run id 与全 rank 证据再清理。
    execution_recording: 五步执行与记录方法（审核清单→rank 映射与时钟核对→A→B/C/D 单变量→每轮恢复基线；偏离设计如实记录）。
