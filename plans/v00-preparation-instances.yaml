  known_fields:
    question_and_hypotheses: 预注册 N1 缺 rank/错序、N2 上游控制流阻塞、N3 GPU/driver 先失败、N4 transport/网络先失败、N5 等待预算不足；每项都允许无法判断。
    layered_design: A 框架正确性/进度基线＋nccl-tests 通信工具基线（固定 b4d5beeb 身份；busbw 不当物理链路利用率；工具不复现框架控制流）→ B 被动观测（debug 文件唯一命名、RAS、PyTorch dump/trace；观测显著干扰即单独标记）→ C 控制流/次序单变量注入（限隔离可回收进程）→ D transport 路径对照（仅已有接口/transport 证据时）→ E GPU/driver 对照（仅早于 timeout 的 Xid/CUDA 证据时）。
    version_applicability_rule: RAS 页属 NCCL 2.27.5（RAS 自 2.24 起可用）、PyTorch 变量页属 2.8；目标版本不满足时对应观测项记"不适用"，不得以相似变量名替代。
    observation_fields: GPU/节点、软件、网络、communicator 契约、工作负载、观测、资源七类必填字段（方案"环境与输入"表）。
    preregistered_criteria: 支持 N1–N5、实验失败与无法判断的预注册判据表；未出 RAS outlier 不作为无异常结论；单次 MISMATCH/#wrong 0/调大 timeout 不构成通过。
    stop_and_recovery_requirements: 独占 GPU/节点与 NIC/rail；分项权限（运行、RAS 端口、状态读取、attach、环境变量）分别授权；日志容量预设；注入限短时可回收进程并设硬性时限；不在共享 fabric 做破坏性注入；停止判据与"先保存证据再清理"。
    execution_recording: 五步执行与记录方法（审核环境与授权→双基线→B→C/D/E 逐层单变量→每轮撤销配置并重复基线）。
  unknown_fields:
    environment_identity:
