schema_version: 1
plan_type: v00_preparation_instances
created_at: '2026-10-22'
status: prepared_skeletons
parent_plan: plans/validation-backlog.yaml
notice: >-
  本文件执行 plans/validation-backlog.yaml 中 V00 的"先收集已知字段，未知项在该实例保留"步骤：
  为每个验证包/子组整理一份准备实例骨架。所有实例 readiness 均为 not_ready——未取得任何真实
  资源、授权、脚本冻结件或证据；不改变任何 V 包的 status 与 executed_at，不构成执行授权，
  不使任何验证子组就绪。已知字段是对既有方案条目与正文方法锚点的整理，不是新主张；
  方法细节以所引条目正文为准，本文件不复制其全文。fragment 约定：
  preparation_instance_ref 的 #后缀为 package id，package_index 给出该包全部实例 id。
result_policy_adopted: 继承 plans/validation-backlog.yaml 的 result_policy（原始证据外置；reproduced 仅在真实执行、证据可定位且范围固定后更新）。
delivery_record: docs/research/v00-preparation-record.md
package_index:
  V01: [V01]
  V02: [V02]
  V03: [V03]
  V04: [V04]
  V05: [V05]
  V06: [V06-CPU, V06-DCP-MULTIRANK]
  V07: [V07]
  V08: [V08]
  V09: [V09]
  V10: [V10-LOCAL-EXT4-NVME, V10-NFS-V41, V10-RGW-S3, V10-LUSTRE]
  V11: [V11-SHARING-ISOLATION, V11-NODE-CHANGE, V11-CONTROL-PLANE, V11-SERVICE-RECOVERY]
  V12: [V12]
instance_schema:
  id: 实例稳定 ID；V06/V10/V11 按 phase/subrun 拆分
  package: 所属验证包（validation-backlog.yaml 的 V id）
  subgroup: 子组名（无子组为 null）
  scheme_refs: 既有方案条目的内容 ID（scheme-less 包为空）
  method_content_refs: 提供方法/判据/边界锚点的正文文件（仓库相对路径）
  source_anchors: 既有来源登记 ID（本文件不新增来源）
  known_fields: 已由方案/正文固定或声明的设计、判据与边界（概述＋指向，不复制全文）
  unknown_fields: 逐项缺项；在实例通过 V00 验收前保持未定
  instance_pass_requirements: 该实例通过 V00 验收在 common_pass_floor 之上另须补齐的增量集合（局部清单完成而共同门槛未满足时不得判实例通过）
common_pass_floor: >-
  任何实例通过 V00 验收，除自身 instance_pass_requirements 增量外，还须同时满足以下共同门槛：
  ①真实环境身份（硬件/OS/固件/驱动/包/镜像/模型/输入/拓扑，按该实例适用范围）冻结并保存可追溯
  环境档案（外置）；②来源/脚本/输入冻结，预先判据与适用重复策略已登记；③已有授权范围、资源窗口、
  隔离与资源预算可审阅；④停止、清理与恢复条件及负责人可审阅；⑤外置脱敏证据位置已预留并记录。
  适用项缺失时实例保持 not_ready；确不适用的项须给出范围与理由，不得静默省略。共同门槛与增量
  都不要求在本轮取得资源或授权，也不构成执行授权。
