    network_identity: NIC/端口/固件、IB/RoCE/EFA 或 socket、MTU/GID/rail/交换路径、rank→GPU→NIC 映射
    version_applicability_check: RAS（2.24+）与 PyTorch 观测变量在目标版本的实际可用性核对结果
    communicator_and_workload: process group 成员/创建顺序、rank 契约、最小 collective 与结果正确性检查
    frozen_scripts_and_inputs: null
    repetition_and_thresholds: warm-up/iterations、重复次数与时间口径
    resources_available: null
    authorization_scope: null
    evidence_location_external: null
