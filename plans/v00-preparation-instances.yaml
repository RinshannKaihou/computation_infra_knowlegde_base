  - 满足 common_pass_floor 全部适用项（授权范围、资源窗口/隔离、停止/清理/恢复负责人、外置证据位置均可审阅；不适用项给出范围与理由）
common_unknowns_note: >-
  所有实例共同的缺项——resources_available、authorization_scope、evidence_location_external、
  cleanup_recovery_owner 均为 null：尚未取得独立资源与授权，外置脱敏证据库尚未建立，清理/恢复
  责任人未指定。这些字段只有在真实取得并记录后才能填写；填写并通过该实例验收只使对应验证子组
  就绪，不代表任何验证已执行。
