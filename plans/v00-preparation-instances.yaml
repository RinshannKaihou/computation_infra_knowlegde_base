    stop_and_recovery_requirements: 专用节点与隔离命名空间；确认无其他租户依赖目标设备；不重启共享 kubelet/引擎/插件；影响其他负载或账本漂移即停；Pod 自动清理与资源回收方案。
    execution_recording: 八步执行与记录方法（主机/插件基线→Pod 规格审核→B0→进程内观察→C0→N1→R0→清理核对）。
