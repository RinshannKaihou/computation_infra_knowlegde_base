  title: 昇腾版本配套验证——准备实例
  instance_status: skeleton_prepared
  readiness: not_ready
  prepared_at: '2026-10-22'
  scheme_refs:
  - software-stack.ascend-version-mismatch-experiment
  method_content_refs:
  - knowledge/02-software-stack/ascend-version-mismatch-triage.md
  - knowledge/02-software-stack/environment-installation-and-upgrade.md
  source_anchors:
  - src.ascend.torch-npu-v7.2.0-pytorch2.6.0
  - src.huawei.cann-83rcx-install-2026-09-29
  known_fields:
    question_and_hypotheses: 单版本变量能否在依赖解析/导入链接/运行时/最小算子边界产生可重复差异，恢复基线后消失（H1）；多变量联动或基线失败即无法判断；不验证上层引擎/通信/数值正确性。
    candidate_core_declared: TorchNPU README 固定配套声明——CANN 8.3.RC1 × PyTorch 2.6.0 × TorchNPU 2.6.0.post3，Python 3.9/3.10/3.11；仅覆盖 README 声明范围，不构成可执行基线。
    group_design: B0 基线 / N1 改 PyTorch / N2 改 TorchNPU / N3 改一组 CANN 用户态子包 / R0 恢复；N 组分开运行、每次自同基线重建；重复数与阈值执行前固定。
    minimal_function_path: README Quick Verification 代表的两个 NPU tensor 矩阵乘路径；实际脚本、随机种子、输入值与容差须执行前冻结。
    observation_fields: 身份 / 解析 / 加载 / 设备 / 计算 / 恢复 六类必记字段（方案"观测字段"表）。
    preregistered_criteria: 支持 H1 须同时满足身份相同＋单变量＋首差异重复稳定＋恢复消失；N 组无差异只说明该最小路径未暴露问题；三类结论（支持 / 失败 / 无法判断）与失效条件已在方案预注册。
    stop_and_recovery_requirements: 仅可销毁隔离环境与专用节点；不改共享 CANN/驱动/固件；不运行上层模型或 HCCL；影响租户、需重启共享服务、无法恢复基线或加载文件与清单不一致即停。
    execution_recording: 七步执行与记录方法（审核基线依据→隔离环境→B0 记录→单 N 组复核→保存首个失败→R0→重复稳定性）。
    related_method_anchors: 三平台安装验证梯子、迁移升级变化矩阵与回退边界（environment-installation-and-upgrade，T02-12）可作 B0/N/R 身份冻结与恢复门槛的登记参照。
  unknown_fields:
    environment_identity:
    - 专用 NPU 节点、硬件型号与拓扑、驱动/固件精确身份
    - OS/内核与 CPU 架构、容器运行时与镜像 digest
    - CANN 全部必需子包、安装介质来源与摘要
    - Python 精确补丁版本、PyTorch/TorchNPU wheel 文件名、索引来源与摘要
    - 动态库搜索路径与实际加载文件
    frozen_scripts_and_inputs: null
    repetition_and_thresholds: 重复次数、判定阈值与最小功能数值容差（不得看结果后调整）
    resources_available: null
    authorization_scope: null
    evidence_location_external: null
    cleanup_recovery_owner: null
  instance_pass_requirements:
  - 冻结环境身份并保存可追溯环境档案（外置），补齐 unknown_fields.environment_identity 全部条目
  - 取得独立节点资源窗口、隔离与恢复授权并记录负责人
  - 冻结脚本/输入/重复次数/判据，预留外置脱敏证据位置
  - 满足 common_pass_floor 全部适用项（授权范围、资源窗口/隔离、停止/清理/恢复负责人、外置证据位置均可审阅；不适用项给出范围与理由）
