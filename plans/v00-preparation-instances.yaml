    preregistered_criteria: 通过须 B0/R0 每层身份一致、C0 无分配且隔离条件成立、若执行 N1 则其差异稳定首现于逻辑 ID 选择并随恢复消失（无法安全构造单变量 N1 时只保留 B0/C0/R0 并把 H3 记为未验证，不否决其余设计范围）、清理后账本与健康回基线；多变量同变即无法判断。
