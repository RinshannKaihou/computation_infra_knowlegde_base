  - 完成 RAS/trace 版本可用性核对并记录"适用/不适用"
  - 冻结 communicator 契约、工作负载、观测方案、单变量清单与重复次数，预留外置证据位置
  - 满足 common_pass_floor 全部适用项（授权范围、资源窗口/隔离、停止/清理/恢复负责人、外置证据位置均可审阅；不适用项给出范围与理由）
