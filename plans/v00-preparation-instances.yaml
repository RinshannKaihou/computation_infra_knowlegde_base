- id: V04
  package: V04
  subgroup: null
  title: NCCL 超时验证——准备实例
  instance_status: skeleton_prepared
  readiness: not_ready
  prepared_at: '2026-10-22'
  scheme_refs:
  - communication.nccl-timeout-experiment
  method_content_refs:
  - knowledge/03-communication/nccl-timeout-triage.md
  - knowledge/03-communication/bandwidth-baselines.md
  source_anchors:
  - src.nvidia.nccl-user-guide-2.27.5
  - src.nvidia.nccl-tests-b4d5beeb
