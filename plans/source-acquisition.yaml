# 生命周期（2026-10-22）：历史冻结，原地逻辑归档。
# 保留候选来源池及当时的选读状态；不是当前采集队列，不要求遍历或完成全部工作包。
# 下方 planned、collecting 等历史字段保持不变；实际采用证据仍查正文与来源登记表。
# 当前入口：../docs/current-status.md；归档说明：../docs/archive/README.md。
schema_version: 1
plan_type: source_acquisition
created_at: '2026-09-29'
status: in_progress
notice: 来源工作包按实际选读范围更新，不要求首轮镜像或读完所有项目。首轮 41 项正文及各批来源审阅已交付；已登记来源不等于全项目采集完成。技术审阅与现场验证分开，未采用的来源和未覆盖主题保留 planned/collecting。
common_steps:
- 先领取内容任务，确定要回答的问题和获取范围
- 在原站选择 release/ref，解析 commit，确认文件与文档许可
- 从选定文件树定位路径，获取最小文档/实现/测试组合
- 记录定位、获取时间、摘要、主张、前提、反例和未知
- 正式使用前登记具体来源，依模板写成内容并近旁引用
- 独立做来源与版本审核，再运行结构检查和构建
storage_policy: 允许保存的原件和工作笔记留暂存区；正式知识进 knowledge/。首批正式库保留链接、原创归纳与审计记录，不镜像外部全文或保存软件发行包。
