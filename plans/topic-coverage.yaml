definitions:
  covered: 已覆盖（基础范围）：本行核心问题已有可串联的实质正文和使用/观测/诊断/验证方法入口；只覆盖所列基础范围。
  partial: 部分覆盖：有直接讨论本主题的正文，但核心子问题、平台分支或方法仍存在所列缺口。
  missing: 未覆盖：只有背景提及、字段、来源/导航或相邻主题，尚无实质回答核心问题的正文。
  evidence_refs: 直接支撑本行已有内容的稳定内容ID；文档与核对章节见documents。
  background_refs: 仅供接续阅读的内容ID，不计入本主题的正向覆盖。
  verification: 待执行方案可证明验证方法已写，不证明本地验证成功；source_checked、编辑审阅、reproduced分别维护。
  priorities: high/normal是后续内容补齐顺序建议，maintain表示本行基础内容维护；不是审阅问题严重性。
