policy:
  new_content_status: draft
  review_model: gpt-6.1-sol
  review_effort: xhigh
  reviewer_role: 独立于撰写；发现修订后定向复核，实际模型/角色如实记录。
  review_fallback: 2026-10-13 起试用 claude-opus-5-5 优先审阅；出现 fallback（[frontier_llm] 标记、模型不一致或认证/路由失败）则该轮弃用并切回本约定模型；每轮核验元数据与标记并记入审计。详见 docs/authoring-guide.md 第 7 节。
  source_readiness: 技术内容任务必须固定精确来源与版本/许可/边界才进入 drafting；导航任务核对已验收正文、路径目标和阅读次序，不强制新增外部来源。不将主页登记、发现入口或当前计划当作已核验材料。
  task_statuses:
  - planned
  - collecting
  - drafting
  - reviewing
  - revising
  - done
  - blocked_on_evidence
  done_definition: 目标草稿交付和本批审阅/修订/复核/结构构建完成；主题 covered 须另外逐项验收，reproduced 须真实证据。
  dependency_semantics: depends_on 是具体前置交付，批内按顺序；context_topic_refs 是先修/边界阅读，不要求整个主题先关闭，避免跨域人工循环。
  same_file_rule: 同一路径的不同任务按批次及列表顺序处理，不同时编辑；稳定 ID 不改变。
  batch_capacity:
    max_tasks: 5
    max_work_units: 8
    units_notice: 1/2 是相对范围等级，不是工时、页数或风险。
  validation_plan: plans/validation-backlog.yaml
  source_plan: plans/followup-source-acquisition.yaml
  scope_changes: 保留主题编号与任务ID；必要调整记录原因，同步路线图、任务/依赖/批次、主题映射与统计。
  mandatory_scope_gate: 必交分支的必要来源或真实证据不足时，保留 blocked_on_evidence / open；unknown 是边界记录，不自动把未交付的原范围改为 covered。
  dependency_information: docs/batch-dependencies.md；机器可读视图 plans/batch-dependencies.yaml；以原 tasks[].depends_on 为权威。
  parallel_execution: 批次依赖是保守聚合；可先做独立任务的来源准备，来源/输入及具体任务前置验收通过后推进该任务。context_topic_refs 不产生整主题等待；共享写入由同一集成角色串行处理。
