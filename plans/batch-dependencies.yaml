notice: 静态依赖视图，来源为主清单；不表示批次尚未启动/已经完成或来源已就绪。主任务状态须按实际运行产物和审阅更新。
semantics:
  task_dependencies: tasks[].depends_on 是权威前置；对具体任务验收合格后可解锁依赖它的任务。
  context_topics: context_topic_refs 仅为先修/边界参考，不要求整个主题关闭。
  batch_projection: 把任务的跨批前置聚合到批次，采用前置整批验收作为保守调度门槛；未满足整批门槛不阻止独立任务的材料准备。
  minimal_predecessors: 仅删除在批次层由其他前置链已保证的边；不删除或替代原任务depends_on。
  partial_progress: 无任务前置且来源通过入口的任务可先撰写；其他任务可先做材料准备，须在使用前置交付前完成相应验收。
  common_writes: 来源登记、域索引/路径、计划/审阅记录与build由同一集成角色串行修改；不同正文可独立推进。
  update_rule: 主清单任务ID/标题/批号/依赖/参考主题/目标改变后重算本视图、图、批次表和waves，并核对task_graph_sha256。
