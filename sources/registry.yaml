  notes: "可变网页，2026-10-09 观察并复核 DGX OS ISO Boot Options 节（示例 ISO 版本 DGXOS-7.6.0-2026-08-27）。核对：页首 Caution 为重镜像「erases all data stored on the OS drives」（含 /home），需保留的文件应先移到 /raid 并选保留选项；GRUB 菜单两个分支——**默认「Install DGX OS <version>」分支重新分区全部驱动器（OS 盘与数据盘），数据盘配置为 RAID 阵列挂载 /raid，覆写 OS 与数据盘上的全部数据和文件系统**；显式「Install DGX OS <version>: Without Reformatting Data RAID (does not mount /raid)」分支才保留数据盘（cache daemon 默认禁用、/etc/fstab 注释 /raid、不格式化 RAID 盘）；重镜像不改变 MIG 设置与数据盘加密等持久硬件配置；ISO 需 Enterprise Support 账号下载；另可选 Encrypted Root 安装。重镜像是安装/恢复动作，文档未作任何 sanitization 合规声明——**不赋予 NIST Clear/Purge 等级**（按 §4.5 验证/确认框架，重装或重格式化不构成清除等级证据）；不存在「默认不覆盖数据盘」「只覆盖 OS 盘」的概括；DGX 整机退役/处置的专门官方文档未取得。2026-10-09 按独立审阅 B14-C08 修订。"
