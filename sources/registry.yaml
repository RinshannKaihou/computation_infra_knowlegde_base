  notes: batch-16 T02-06（operators-compilers）与 T02-07（gpu-op-graph-triage）两记录共用本页，T02-07 另建议别名 ID src.pytorch.compile-troubleshooting-2.6，合并登记于本条（pytorch.org/docs/2.6/ 域 301 重定向至此）。核对：graph break 机制（遇不可追踪代码时编译已得 FX graph、以 eager 运行不支持代码、再恢复追踪）；guard 为运行时检查（示例 TENSOR_MATCH 检查 type/device/dtype/shape/stride/requires_grad，文档明示示例输出可能随版本变化）；TORCH_LOGS=graph_breaks/guards/recompiles/dynamic 与深调 trace_bytecode/trace_source/graph_code/bytecode/aot_graphs/output_code/kernel_code 及 +all/+dynamo/+aot/+inductor、可编程 torch._logging.set_logs；tlparse/TORCH_TRACE="/tmp/tracedir" 收集后 pip install tlparse 出 HTML 报告（分布式每 rank 一份；官方建议先 tlparse 后 TORCH_LOGS；trace 含全部模型代码、敏感模型不应外发、不含权重；tlparse 为 PyPI 独立包、版本未页内固定）；消融链 backend="eager"→"aot_eager"→"aot_eager_decomp_partition"→"inductor"，再叠 mode default/reduce-overhead/max-autotune 与 dynamic=True/False/None（仅定位到组件层，不证明组件内根因）；Minifier TORCHDYNAMO_REPRO_AFTER="dynamo"/"aot" 生成 repro.py、精度问题 TORCHDYNAMO_REPRO_LEVEL=4（官方自述 most of the time nowadays, the minifier doesn't work as expected，不作必得步骤）；重编译上限超限回退 eager 属静默性能退化、需主动识别告警；suppress_errors=True 崩溃时跳过追踪（官方称非最佳实践）；@torch.compiler.disable 局部禁用；上报 issue 复现要素清单（autograd、动态形状、自定义算子、config、上下文管理器、tensor subclass，页内自述 non-exhaustive）。
