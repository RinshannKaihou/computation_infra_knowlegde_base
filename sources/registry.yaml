- id: src.nist.sp-800-88r2-2025-09
  title: NIST SP 800-88 Rev.2, Guidelines for Media Sanitization（final，2025-09）
  url: https://csrc.nist.gov/pubs/sp/800/88/r2/final
  kind: documentation
  registered_at: '2026-10-09'
  revision: Rev.2 final（2025-09；ERB 批准 2025-09-12；DOI 10.6028/NIST.SP.800-88r2）
  license:
    status: identified
    scopes:
    - scope: Publication History 前声明段（美国政府作品）
      identifier: NIST 美国政府作品（not subject to copyright in the United States）
      url: https://csrc.nist.gov/pubs/sp/800/88/r2/final
    notes: "「This publication may be used by nongovernmental organizations on a voluntary basis and is not subject to copyright in the United States. Attribution would, however, be appreciated by NIST.」美国境外版权状态未逐一确认；引用署名 NIST。"
  notes: "Rev.1（2014-12）已于 2025-09-26 撤回（Withdrawn）并被 Rev.2 整体取代，Rev.1 仅作历史背景，正文引用以 Rev.2 为准。PDF（https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-88r2.pdf）2026-10-09 下载 pdftotext 逐节核对：§3.1.1–3.1.3 Clear/Purge/Destroy 定义（SSD 等有过剩预留的闪存「multiple overwrite passes…should be avoided as very little confidentiality protection is achieved」；去磁对非磁性介质不适用且现不被视为批准的 destroy 技术；打洞/弯折只算部分损坏）；§3.2 密码学擦除 CE（purge 技术，联邦机构须用 FIPS-140 验证模块，依赖加密实现质量与密钥清除可追溯性，云/虚拟化逻辑存储下可能是唯一可行 purge 选项；Appendix B 要求向 ISM 厂商索取实现与验证信息）；§4.3.3 不复用时 destroy 最简单经济、§4.3.4 保修换件/折抵等不返还的介质视为脱离组织控制（交维护商需保密合同）、§4.3.6 决策须记录、§4.4 执行应符合 IEEE 2883 或组织认可标准；§4.5.1 验证（检查清除动作完成状态，除组织策略要求外不需精细抽样）与 §4.5.2 确认（判定目标数据是否有效清除）分离，反例：SSD 去磁「completed successfully, but no sensitive data is sanitized」；§4.6 处置记录 Certificate of Sanitization 字段清单与 Appendix C 样表（含去向勾选；清除后去除原密级标记；台账缺口使记录只能证明「这些介质清过」而非「所有介质都清了」）；§4.7 角色分工为美国联邦语境，正文需映射而非照抄。"
