    notes: "许可页已核对（\"Permission is hereby granted … to deal in the Software without restriction\"）。"
  notes: "2026-10-09 观察。核对 conceptual/ras（ECC 1-bit 由硬件纠错并记录、uncorrectable 2-bit 必须上报；CPER 含 Error source/Error type/severity（0 Recoverable=non-fatal uncorrected、1 Fatal、2 Corrected、3 Informational）与 Timestamp；AFID 是事件/错误唯一数值 ID，每条 CPER 至多 12 个）、conceptual/gpu-reset-behavior（XGMI/Infinity Fabric 系统上复位一个 GPU 会复位同一 XGMI hive 内所有 GPU，复位前用 amd-smi xgmi/topology 或 xgmi_hive_id 确认成员；ROCR_VISIBLE_DEVICES/HIP_VISIBLE_DEVICES \"do not create a kernel-enforced isolation boundary\"；\"Do not assume that amd-smi reset --gpureset provides per-GPU fault containment inside an XGMI hive\"；复位期间 KFD 驱逐队列、应用须重建全部 GPU 状态；「Further reading」指向 driver-misc.html 的链接与内容不符——内核侧无独立 GPU recovery 文档页，文档缺口已记录）、how-to/amdsmi-cli-tool（无独立 ecc 子命令；metric -e 输出 TOTAL_CORRECTABLE/UNCORRECTABLE/DEFERRED 等，-k 按 IP block 分解；**monitor -e/--ecc 为 ECC 单/双比特与 PCIe replay 错误计数的采样快照，不是事件流，持续采样须显式加 -w/--watch（可配 --watch_time/--iterations）**；bad-pages -p/-r/-u；ras --cper 需 sudo、--afid 纯离线解析无需驱动/GPU；About N/A values 三分 Not Applicable/Not Available/Empty Section，须区分字段级与节级，Empty Section 含「无条目」与「整节查询失败」两种官方情形；**violation 为大写 -V/--violation，小写 -v 是 --vram-usage 显存用量**，-V/--violation 仅 MI300 或更新；**reset Warning 列三项影响范围：XGMI hive、共享上游 PCIe switch 的 Secondary Bus Reset（不受 hive 边界限制）、持有 /dev/kfd 句柄的进程可能被终止（ROCR/HIP_VISIBLE_DEVICES 不能阻止）**；reset --gpureset 需 sudo）、install（amd-smi 是 rocm_smi 后继；驱动 gpu_metrics 版本比 AMD SMI 新导致 N/A 为一等采样失败源）。CLI 页内嵌 --help 示例显示 \"Version: 27.0.0 | ROCm version: 7.14.0\" 为旧版捕获，页面版本以 27.1.0 为准；latest 与 docs-10.1.0 可能漂移，引用固定 docs-10.1.0。CLI 声明为示例代码，官方推荐 Python/C++ 库作为健壮数据源。本库未运行该工具。2026-10-09 按独立审阅 B14-C03/C05/C06 复核修订：monitor 参数表、reset Warning 三项、About N/A values 逐字复核。"
