  notes: "研究记录 kind 为 pull-request，按 schema 枚举归入 issue。归因（PR 正文，jansel 提交、bobrenjc93 批准）：torch.linalg.eigh 经 Inductor lowering 为 fallback 算子 aten._linalg_eigh.default（CUDA 上由 cuSOLVER 支撑），图捕获期间执行不安全；Inductor 的 cudagraph 分区未把该算子归类为 unsafe，故 max-autotune 可能把它放进捕获分区并在录制时失败；修复用既有 cudagraph-unsafe 归类机制而非特判 max-autotune（the unsupported behavior belongs to the operator's CUDA implementation regardless of the compile mode that tries to capture it）。合并内容：torch/_inductor/utils.py +2 行（向 cudagraph-unsafe 算子表加 aten._linalg_eigh.default，注释 cuSOLVER-backed linalg.eigh is not CUDA graph capturable）；test/inductor/test_cudagraph_trees.py +34 行回归测试 test_graph_partition_max_autotune_skips_linalg_eigh（断言 unsafe 归类、按 issue 复现跑 matmul→eigh 模式 3 次迭代、FileCheck 断言 Created 2 graph partitions: 1 cudagraphable, 1 non-cudagraphable）；commit URL https://github.com/pytorch/pytorch/commit/0ab462c59c2a26ae36624635db822125e4cb710c（本条含 PR 与 commit 两对象）。边界：回归测试带 @skipIfRocm，上游回归只覆盖 CUDA——unsafe 归类表在框架层、后端无关，但 HIP 侧 cuSOLVER 对应物（hipsolver）的捕获安全性无上游测试证据，不能写成 ROCm 同样验证通过；PR 自述 Generated by my agent，归因强度锚定在合并代码+测试+批准人，不锚定 issue 讨论串；Test Plan 的修复前后对照与 B200 计时（eager 0.3085 ms / no-cudagraphs 0.3155 ms / 修复后 max-autotune 0.3554 ms）为提交者自述，本库未复现。"
