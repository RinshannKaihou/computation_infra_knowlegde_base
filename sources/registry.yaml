    scopes: []
    notes: 华为版权；本库仅链接并作原创归纳。
  notes: 2026-10-09 观察。取得口径（按独立审阅 B14-C10 及其定向复核）：本条列出的具体事件码条目已于 2026-10-09 第二轮经渲染提取取得事件类告警页原文，并逐字核对含义/说明/影响/建议一致（页面为 JS 渲染，此前两轮直接 curl 仅取得约 386 字节页面壳；核对明细见 docs/research/batch-14-bmc-firmware-sources.md）；全册未引用条目不作完整性断言，该检索路径的稳定性不作保证。告警模型：十六进制事件码 + 参数化消息（_arg1_..），按部件分段编号（0x00 CPU、0x01 内存、0x02 硬盘、0x03 PSU、0x04 风扇、0x08 PCIe 卡、0x0D NIC、0x1A iBMC 自身、0x2C 系统、0x40 xPU 板、0x56 NPU 等），每条含影响与建议。记录条目：0x0100000D memory correctable ECC（影响「降低系统性能」）、0x56000019 NPU historical ECC count 达阈值、0x0D000007 NIC PFAE 健康退化、0x100000C3 RTC 获取失败（iBMC 侧日志时间不准确）、0x1A000029 iBMC 时间跳变、0x1A000011/0x1A00001B/0x1A00001D 事件/操作/安全日志 90% 容量、0x1A000025 iBMC-iBMA 心跳丢失、0x2C00000F unrecognized reason 重启（官方显式原因不明，不可归因）、0x0200000F RAID rebuild stopped（重构停止≠成功）、0x2C000063 BMC 重启主机（固件升级等计划内事件，跨层时间线需排除）。「不同型号的服务器，同一通道对应的内存数量不同」为原文说明。文档 05 与 iBMC 用户指南 13 版本不齐，告警码随版本增减，不可跨版本合并引用。**iBMC 告警码与带内黑匣子/健康管理码之间的官方映射关系未取得**（「告警条目取得」与「带外—带内映射取得」分离）。**独立核验状态（2026-10-09 第三轮标注）**：取得方式差异如实记录——编写者经渲染提取取得事件类告警页正文并逐字核对本条所列 12 个事件码（此前两轮直接 curl 仅得 JS 页面壳）；独立审阅者（gpt-6.1-sol / xhigh）两轮（初审定向复核与第二轮定向复核）均未能取得该页原文，本条所列事件码的含义/影响/建议为编写者核对记录、**未独立核验**，引用方不据此单独建立处置规则（处置以现场确认与厂商支持为准），与 Batch 13 对 0x80E20207/0x80E21007 xlsx 的处理先例一致。
