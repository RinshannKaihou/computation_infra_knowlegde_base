- id: src.ascend.torch-npu-v7.2.0-pytorch2.6.0
  title: TorchNPU v7.2.0-pytorch2.6.0 固定源码快照
  url: https://github.com/Ascend/pytorch/tree/bc51ab84cc6f35c77aab1c59886e0ea43681a317
  kind: repository
  registered_at: '2026-09-29'
  revision: bc51ab84cc6f35c77aab1c59886e0ea43681a317
  license:
    status: partial
    scopes:
    - scope: 固定 commit 的仓库根 LICENSE；第三方文件按各自声明核查
      identifier: BSD-3-Clause
      url: https://github.com/Ascend/pytorch/blob/bc51ab84cc6f35c77aab1c59886e0ea43681a317/LICENSE
    notes: 根 LICENSE 条款已核对；该快照无 docs/LICENSE，未完成各文档和第三方文件的适用许可核验。发行 wheel、CANN/HDK 软件包的许可另行核查。
  notes: tag v7.2.0-pytorch2.6.0 在核查时解析到此 commit。引用英文 README 与 version.txt 的配套声明；该快照无独立 COMPATIBILITY 文件，README.zh.md 存在合并冲突标记。未下载或运行发行包。第八批（2026-09-30）补充核对：torch_npu/npu/memory.py 内存 API 与 torch_npu/npu/__init__.py 导出；csrc 的 NPUCachingAllocator、NPUWorkspaceAllocator、NpuUtils、OpParamMaker、OptionsManager 与 memory_snapshot；PYTORCH_NPU_ALLOC_CONF 在该快照支持 max_split_size_mb、garbage_collection_threshold、expandable_segments、base_addr_aligned_kb、page_size 五个选项，而 master 分支选项集已变化（master 仅作发现入口）；docs/api/torch_npu_apis.md 对照表的内存 API 覆盖与空缺；test/npu/test_expandable_segments.py；third_party/acl/inc 头文件中的 207001/245002 错误码。注意 memory.py docstring 多处沿用 CUDA 措辞（如 nvidia-smi、cudaMalloc），不作为 NPU 行为证据；该快照文档许可仍未核验。代审修订（2026-09-30）补充：alloc_block L2692–2694 的进程额度分支（set_fraction 超额时分配器自设 207001，不调用运行时）、setMemoryFraction L1717–1724、OOM 文案的 allowed 字段（L1391–1394）、garbage_collection_threshold 生效条件（L1353–1369、L2624–2629）。第十一批（2026-10-08）补充：csrc/aten 目录结构与 codegen 生成的注册方式（codegen/templates/CustomRegisterSchema.cpp 等）、VariableFallbackKernel.cpp 的 AutogradPrivateUse1、PrivateUse1 CPU fallback 与 SparsePrivateUse1 报错分支（全文 L232–271，aten/CMakeLists.txt 收集该文件）、third_party/torchair vendored 构建脚本、csrc/core/npu/NPUGraph.cpp（图捕获）与 torch_npu/_inductor/、OptionsManager.cpp 的 ASCEND_GLOBAL_LOG_LEVEL（L229）、TORCH_NPU_DISABLED_WARNING（L584）等环境变量读取点。 2026-10-08 审阅修订 B11-C01：PrivateUse1 分支调用 at::native::cpu_fallback 并按算子名去重提示性能影响，不能从 autograd 文件头推断无 CPU fallback；具体算子回退成功、性能和梯度正确性未执行验证。
