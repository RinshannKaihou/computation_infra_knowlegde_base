  notes: 核对：HCCL（Huawei Collective Communication Library）为基于昇腾 AI 处理器的高性能集合通信库，提供单机多卡/多机多卡数据并行、模型并行集合通信方案；支持 AllReduce、Broadcast、AllGather、ReduceScatter、AlltoAll 等原语与 Ring、Mesh、Halving-Doubling（HD）算法，基于 HCCS、RoCE 和 PCIe 高速链路；支持产品 Atlas A2 训练系列、Atlas 训练系列、Atlas 300I Duo 推理卡；软件架构三层（适配层/集合通信业务层（通信框架+通信算法）/集合通信平台层）；通信四阶段（通信域初始化→建立连接（socket 建链，超时上报建链超时错误）→执行通信（经 Runtime 下发任务调度器）→销毁）；框架接入——C 语言接口用于单算子模式框架适配（HCCL 单算子 API 嵌入 PyTorch 后端代码，PyTorch 用户直接用原生集合通信 API 即得分布式能力），Python 接口用于图模式框架适配。83RC1 树对应页未核对；已登记 src.huawei.hccl-user-guide-cann-8.1-rc1-alpha001（8.1 线 PDF）与 src.huawei.hccl-api-cann-8.0-rc1-alpha003（8.0 线 PDF）为其他版本线，三线不可混；TorchNPU 进程内如何加载 HCCL 需以固定源码/发行包证据另行确认，不从本句反推版本配套。
