  notes: "观察层：环境 torch 2.14.0.dev20260624+cu130、CUDA 13.0；含 torch.linalg.eigh 的函数在 torch.compile(mode=\"max-autotune\") 下第二次迭代失败——torch.AcceleratorError: CUDA error: operation not permitted when stream is capturing（cudaErrorStreamCaptureUnsupported），随后 operation failed due to a previous error during capture（cudaErrorStreamCaptureInvalidated）；栈顶在 torch/_inductor/cudagraph_trees.py 的 _record。报告自带三组对照：eager 正常、max-autotune-no-cudagraphs 正常、max-autotune 失败（满足显式 eager/compile 对照的证据形态）；复现脚本 30 行内自包含。归因与修复链见 src.pytorch.pr-188641-linalg-eigh-cudagraph-unsafe。"
