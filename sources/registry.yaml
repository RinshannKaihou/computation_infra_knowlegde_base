  title: PyTorch图模式使用（TorchAir）指南页组（Pytorch/720 文档树）
  url: https://www.hiascend.com/document/detail/zh/Pytorch/720/modthirdparty/torchairuseguide/torchair_00001.html
  kind: documentation
  registered_at: '2026-10-09'
  revision: null
  license:
    status: unknown
    scopes: []
    notes: 厂商网页未见再分发许可（同既有登记口径）；本库仅链接并原创归纳。
  notes: 可变页，2026-10-09 观察；720 文档树对应 TorchNPU 7.2.0；detail 页为 SPA，正文经 doc_center/source 静态内容地址核对（TorchAir 720 树 detail 与 source 页 ID 自 00003 起一致；00001/00002 source 路径 AccessDenied，简介页引用 detail torchair_00001.html）。页组（URL 为 00001，其余同目录）：00001（简介——TorchAir 为 torch_npu 的图模式能力扩展库，提供昇腾设备亲和的 torch.compile 图模式后端；当前为 beta 特性、主要关注推理场景；config.mode 切换 reduce-overhead（aclgraph，Capture&Replay，经 Runtime aclmdlRICaptureXxx 系列接口实现）与 max-autotune（Ascend IR：FX 图→Ascend IR→GE 图引擎编译执行）；每进程只用 1 张 NPU 卡；aclgraph 仅 Atlas A2 训练系列/Atlas 800I A2 推理/A200I A2 Box 与 Atlas A3 系列支持）、00005（快速上手——import torch_npu 后 import torchair、CompilerConfig 默认 max-autotune、torchair.get_npu_backend(compiler_config=config) 作 torch.compile backend；页面自述示例仅供参考、不支持直接拷贝运行）、00013（run_eagerly=True 在图模式执行前以 Eager 模式执行 FX graph，定界 TorchAir 图变换 vs 图执行器；max-autotune 下所有功能不能同开、reduce-overhead 下仅 FX Pass 可同开；对照的是 FX graph 级 eager，非原生逐算子 eager）、00015（reduce-overhead 配置——与 torch.cuda.CUDAGraph 原生接口功能类似、约束与其保持一致（如不支持 stream sync、动态控制流等）；面向在线推理、暂不支持反向流程 capture 成图、暂不支持随机数算子 capture、不与 max-autotune 同开；「约束一致」为厂商类比，精确差异以 CANN 页为准）、00017（reduce-overhead 编译缓存——五阶段 Dynamo/Guards/aclgraph Capture/Input 处理/Replay，只缓存 Dynamo 环节；限 Atlas A2/A3 产品）、00019（aclgraph 不支持动态 shape，多张 aclgraph 并存；dynamic=False 时每种 shape 一张 FX graph 加一张 aclgraph；前次执行的输出 Tensor 内存会被后续执行覆盖，长时间保存使用可能引入精度问题，可用 Clone（enable_output_clone）；两种内存复用模式）、00021（frozen_parameter=True 缩短下发；PyTorch v2.6.0+ 可用 torch._dynamo.mark_static_address 标记（如 kv_cache）；仅 reduce-overhead；to 算子会丢 Parameter 类型）、00024（max-autotune 编译缓存 torchair.inference.cache_compile 落盘 .torchair_cache/${model_info}/${func}（多机含 world_size/global_rank）；仅 max-autotune；含 RNG 算子不支持；缓存要与执行计算图一一对应，若重编译则缓存失效；Guards 阶段被跳过、要求生成与加载脚本一致；CANN 包跨版本缓存无法保证兼容性，版本升级需清理缓存目录重新编译；ge_cache 另缓存 Ascend IR 编译产物 .om/.idx/.rdcpkt；reduce-overhead 不支持——两个模式缓存阶段不同，正文不得混写）、00029（set_dim_gears 把枚举档位转静态子图一次下发；须与 dynamic=True 搭配；仅 max-autotune）、00045（支持的 ATen API 清单及逐条 dtype 约束，如 torch.addmm fp16/fp32、torch._softmax fp32；清单随版本变化，引用绑定 720 树）。TorchAir 整体 beta，reduce-overhead/编译缓存/FX Pass/动态分档等多页各自标注试验特性暂不支持商用，不得写成正式商用能力或全产品通用；720 树无独立 torch.compile 特性页（2600 树页面在 720 树同路径不存在），torch.compile 支持说明以本指南为准。
